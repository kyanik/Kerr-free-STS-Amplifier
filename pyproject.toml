[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "STS-amplifier"
version = "0.1.0"
description = "Research code for Xonium tunable coupler simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "qutip>=4.7",
  "scqubits>=4.0",
  "tqdm",
  "h5py",
  "jupyterlab",
  "marimo>=0.10"
]
[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "ipykernel"]
jax = ["jax", "jaxlib"]

[project.scripts]
STS-amplifier = "STS_amplifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

license = { text = "MIT" }